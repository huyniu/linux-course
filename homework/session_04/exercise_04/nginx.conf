server {
    listen 80;

    # Dung DNS noi bo cua Docker Compose: ten service thay cho 'localhost'
    # Dau '/' cuoi proxy_pass: bo tien to /users/ truoc khi chuyen tiep
    #   /users/123  ->  http://user_service:8081/123
    location /users/ {
        proxy_pass http://user_service:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    #   /products/abc  ->  http://product_service:8082/abc
    location /products/ {
        proxy_pass http://product_service:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
