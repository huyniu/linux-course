spring.application.name=transaction-service
server.port=8081

# Dia chi account-service: dung ten service trong Docker network, khong dung localhost hay IP tinh
account-service.url=${ACCOUNT_SERVICE_URL:http://account-service:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/banking_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Tra ve ly do loi trong response JSON
spring.web.error.include-message=always
