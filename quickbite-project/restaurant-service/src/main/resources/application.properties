spring.application.name=restaurant-service
server.port=${SERVER_PORT:8082}

# Thong so ket noi database duoc truyen qua bien moi truong
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quickbite_restaurant_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate tu dong tao/cap nhat bang theo cac entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
