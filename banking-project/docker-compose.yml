services:
  core-db:
    image: postgres:15-alpine
    container_name: core-db
    environment:
      - POSTGRES_DB=banking_db
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    # Khong map cong 5432 ra host: chi cac service trong banking-network moi truy cap duoc DB
    volumes:
      # Du lieu PostgreSQL luu tren named volume, khong mat khi xoa container
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d banking_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - banking-network

  account-service:
    build: ./account-service
    container_name: account-service
    ports:
      - "8080:8080"
    environment:
      # Dung ten service 'core-db' lam hostname, khong dung localhost
      - SPRING_DATASOURCE_URL=jdbc:postgresql://core-db:5432/banking_db
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    depends_on:
      core-db:
        condition: service_healthy
    networks:
      - banking-network

networks:
  banking-network:
    name: banking-network
    driver: bridge

volumes:
  pg-data:
    name: pg-data
