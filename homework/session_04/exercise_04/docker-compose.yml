services:
  nginx_proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user_service
      - product_service

  user_service:
    image: storex-user:latest
    build: ./user-service
    # chay port 8081 noi bo, khong can map ra host

  product_service:
    image: storex-product:latest
    build: ./product-service
    # chay port 8082 noi bo, khong can map ra host
