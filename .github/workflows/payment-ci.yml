name: Payment Service CI
on:
  push:
    paths:
      - 'cicd/payment-service/**'
      - '.github/workflows/payment-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cicd/payment-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: chmod +x ./gradlew
      - run: ./gradlew test

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cicd/payment-service
    steps:
      # THU NGHIEM: khong checkout, khong setup Java
      - run: chmod +x ./gradlew
      - run: ./gradlew bootJar
