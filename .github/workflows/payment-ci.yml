name: Payment Service CI
on:
  push:
    # Repo chung nhieu bai: chi chay khi payment-service hoac workflow nay thay doi
    paths:
      - 'cicd/payment-service/**'
      - '.github/workflows/payment-ci.yml'

jobs:
  # Giai doan 1: chay toan bo Unit Test
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cicd/payment-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew test

  # Giai doan 2: chi chay khi job test thanh cong
  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cicd/payment-service
    steps:
      # Job Isolation: moi job chay tren mot runner moi, trong rong.
      # Job build khong thay code hay Java cua job test, nen phai checkout va setup lai tu dau.
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: payment-service-artifact
          path: cicd/payment-service/build/libs/*.jar
          if-no-files-found: error
          retention-days: 3
