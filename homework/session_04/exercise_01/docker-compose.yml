services:
  backend:
    image: storex-backend:latest
    ports:
      - "8080:8080"
    environment:
      # Da sua: dung ten service 'postgres' (DNS noi bo cua Docker Compose) thay vi 'localhost'
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/storex
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=secret
    depends_on:
      - postgres
    # Postgres can vai giay de san sang; neu backend ket noi som qua thi tu khoi dong lai
    restart: on-failure

  postgres:
    image: postgres:13
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=storex
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
