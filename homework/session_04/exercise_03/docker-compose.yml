services:
  backend:
    image: storex-backend:v3
    ports:
      - "8080:8080"
    environment:
      # Gia tri lay tu file .env, khong hardcode thong tin nhay cam
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - storex-net

  postgres:
    image: postgres:13
    # Khong map cong 5432 ra host: chi cac service trong storex-net moi truy cap duoc DB
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - storex-net

networks:
  storex-net:
    name: storex-net
    driver: bridge
